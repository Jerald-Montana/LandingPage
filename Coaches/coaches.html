<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Directory | Pickleball Philippines</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="coaches.css">
</head>

<body>

<section class="coach-hero">
    <div class="hero-glow glow-one"></div>
    <div class="hero-glow glow-two"></div>
    <div class="hero-ball ball-one"></div>
    <div class="hero-ball ball-two"></div>

    <div class="coach-hero-content">
        <div class="hero-badge">PICKLEBALL PHILIPPINES</div>

        <h1>
            COACH
            <span>DIRECTORY</span>
        </h1>

        <p>
            Find certified pickleball coaches across the Philippines.
        </p>
    </div>
</section>

<section class="coach-section">

    <div class="coach-top">
        <div>
            <div class="small-title">REGISTERED COACHES</div>
            <h2>
                <span id="coachCounter">0</span>
                Available Coaches
            </h2>
            <p>
                Browse coach profiles, certificates, contact details, and social links.
            </p>
        </div>
    </div>

    <div class="coach-grid" id="coachGrid"></div>

</section>

<script src="coaches-data.js"></script>
<script src="coaches.js"></script>

</body>
</html>
